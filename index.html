<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CA Muni Bond Yield Curve</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="data.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f8fafc;
      color: #1e293b;
    }

    header {
      padding: 1.5rem 2rem 1rem;
      background: white;
      border-bottom: 1px solid #e2e8f0;
    }
    h1 { font-size: 1.25rem; font-weight: 600; }
    .source { font-size: 0.8rem; color: #94a3b8; margin-top: 0.2rem; }
    .source a { color: #64748b; text-decoration: none; }
    .source a:hover { text-decoration: underline; }

    main { padding: 1.5rem 2rem 2.5rem; max-width: 1000px; }

    .nav {
      display: flex;
      align-items: center;
      gap: 0.625rem;
      margin-bottom: 1rem;
    }
    .nav-btn {
      width: 1.875rem;
      height: 1.875rem;
      border: 1px solid #e2e8f0;
      border-radius: 4px;
      background: white;
      cursor: pointer;
      font-size: 0.875rem;
      color: #475569;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .nav-btn:hover:not(:disabled) { background: #f1f5f9; border-color: #cbd5e1; }
    .nav-btn:disabled { opacity: 0.3; cursor: default; }
    .nav-date { font-size: 0.9rem; font-weight: 500; min-width: 6.5rem; }
    .nav-hint { font-size: 0.8rem; color: #94a3b8; }

    .card {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
    }
    .chart-wrap {
      padding: 1.25rem 1rem 0.875rem;
      height: 380px;
    }
    .section { margin-top: 1.5rem; }

    table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
    thead tr { border-bottom: 2px solid #e2e8f0; }
    th {
      padding: 0.6rem 1rem;
      font-weight: 500;
      font-size: 0.75rem;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    th:first-child { text-align: left; }
    th:not(:first-child) { text-align: right; }
    td { padding: 0.45rem 1rem; border-bottom: 1px solid #f1f5f9; }
    td:first-child { text-align: left; }
    td:not(:first-child) { text-align: right; font-variant-numeric: tabular-nums; }
    tbody tr { cursor: pointer; }
    tbody tr:hover td { background: #f8fafc; }
    tbody tr:last-child td { border-bottom: none; }
    .sig td { background: #f0fdf4; }
    .sig:hover td { background: #dcfce7 !important; }
    .sig td:first-child { font-weight: 600; }
    .yr-badge {
      font-size: 0.7rem;
      color: #94a3b8;
      font-weight: 400;
      margin-left: 0.3rem;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(2px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
    }
    .modal-backdrop.hidden { display: none; }
    .modal-panel {
      background: white;
      border-radius: 10px;
      padding: 1.5rem;
      width: min(600px, 94vw);
      position: relative;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
    }
    .modal-heading { font-size: 1rem; font-weight: 600; margin-bottom: 1rem; padding-right: 2rem; }
    .modal-chart-wrap { height: 260px; }
    .close-btn {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: none;
      border: none;
      font-size: 1.375rem;
      line-height: 1;
      color: #94a3b8;
      cursor: pointer;
    }
    .close-btn:hover { color: #334155; }

    .empty { color: #94a3b8; padding: 2rem 0; }
  </style>
</head>
<body>
<header>
  <h1>California Municipal Bond Yield Curve</h1>
  <p class="source">Source: <a href="https://california.municipalbonds.com/bonds/yield_curve/" target="_blank" rel="noopener">california.municipalbonds.com</a></p>
</header>
<main id="main"></main>

<div class="modal-backdrop hidden" id="modal">
  <div class="modal-panel">
    <button class="close-btn" id="modal-close">&#215;</button>
    <div class="modal-heading" id="modal-heading"></div>
    <div class="modal-chart-wrap"><canvas id="modal-canvas"></canvas></div>
  </div>
</div>

<script>
(function () {
  const snapshots = (typeof YIELD_DATA !== 'undefined') ? YIELD_DATA.snapshots : [];
  const mainEl = document.getElementById('main');

  if (!snapshots.length) {
    mainEl.innerHTML = '<p class="empty">No data available.</p>';
    return;
  }

  const latest = snapshots[snapshots.length - 1];
  const latestYear = new Date(latest.date + 'T00:00:00').getFullYear();
  const CUTOFF = latestYear + 30;
  const SIG_OFFSETS = [1, 5, 10, 20, 30];
  const SIG_YEARS = new Set(SIG_OFFSETS.map(o => latestYear + o));

  // All maturity years present in any snapshot, up to the 30yr cutoff
  const allMaturities = [...new Set(
    snapshots.flatMap(s => s.curve.map(p => p.maturity))
  )].filter(m => m <= CUTOFF).sort((a, b) => a - b);

  function yieldFor(snapshot, maturity) {
    const p = snapshot.curve.find(p => p.maturity === maturity);
    return p !== undefined ? p.yield : undefined;
  }

  let selectedIdx = snapshots.length - 1;
  let mainChart = null;
  let modalChart = null;

  const BLUE = '#2563eb';
  const GRAY = '#cbd5e1';

  // --- Scaffold ---
  mainEl.innerHTML = `
    <div class="nav">
      <button class="nav-btn" id="btn-prev">&#8592;</button>
      <span class="nav-date" id="nav-date"></span>
      <button class="nav-btn" id="btn-next">&#8594;</button>
      <span class="nav-hint" id="nav-hint"></span>
    </div>
    <div class="card chart-wrap"><canvas id="main-canvas"></canvas></div>
    <div class="card section">
      <table>
        <thead>
          <tr>
            <th>Maturity Year</th>
            <th id="th-sel">Yield</th>
            <th id="th-lat">Yield (latest)</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  `;

  // --- Chart ---
  const mainCtx = document.getElementById('main-canvas').getContext('2d');

  function buildDatasets(snapshot) {
    const isLatest = snapshot === latest;
    const datasets = [];

    // Most recent reference line — always dotted; omit when already viewing latest
    if (!isLatest) {
      datasets.push({
        label: latest.date + ' (latest)',
        data: allMaturities
          .map(m => ({ x: m, y: yieldFor(latest, m) }))
          .filter(p => p.y !== undefined),
        borderColor: GRAY,
        backgroundColor: 'transparent',
        borderWidth: 1.5,
        borderDash: [5, 4],
        pointRadius: 3,
        pointHoverRadius: 5,
        pointBackgroundColor: GRAY,
        fill: false,
        tension: 0.3,
        order: 2,
      });
    }

    // Selected date — solid line
    datasets.push({
      label: snapshot.date,
      data: allMaturities
        .map(m => ({ x: m, y: yieldFor(snapshot, m) }))
        .filter(p => p.y !== undefined),
      borderColor: BLUE,
      backgroundColor: 'transparent',
      borderWidth: 2,
      borderDash: [],
      pointRadius: 4,
      pointHoverRadius: 6,
      pointBackgroundColor: BLUE,
      fill: false,
      tension: 0.3,
      order: 1,
    });

    return datasets;
  }

  function renderChart(snapshot) {
    const datasets = buildDatasets(snapshot);

    if (mainChart) {
      mainChart.data.datasets = datasets;
      mainChart.options.plugins.legend.display = datasets.length > 1;
      mainChart.update('none');
      return;
    }

    mainChart = new Chart(mainCtx, {
      type: 'line',
      data: { datasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        parsing: false,
        plugins: {
          legend: {
            display: datasets.length > 1,
            position: 'top',
            align: 'end',
            labels: { boxWidth: 20, padding: 12, font: { size: 11 } },
          },
          tooltip: {
            callbacks: {
              title: items => `Maturity: ${items[0].parsed.x}`,
              label: item => `${item.dataset.label}: ${item.parsed.y.toFixed(3)}%`,
            },
          },
        },
        scales: {
          x: {
            type: 'linear',
            min: latestYear,
            max: CUTOFF + 0.5,
            title: { display: true, text: 'Maturity Year', color: '#64748b', font: { size: 11 } },
            grid: { color: '#f1f5f9' },
            afterBuildTicks(scale) {
              scale.ticks = [];
              for (let y = latestYear; y <= CUTOFF; y++) scale.ticks.push({ value: y });
            },
            ticks: {
              color: '#64748b',
              font: { size: 11 },
              callback: val => SIG_YEARS.has(val) ? `${val} (${val - latestYear}yr)` : '',
            },
          },
          y: {
            title: { display: true, text: 'Avg Yield (%)', color: '#64748b', font: { size: 11 } },
            grid: { color: '#f1f5f9' },
            ticks: { color: '#64748b', font: { size: 11 }, callback: v => v.toFixed(2) + '%' },
          },
        },
      },
    });
  }

  // --- Table ---
  function renderTable(snapshot) {
    const isLatest = snapshot === latest;
    document.getElementById('th-sel').textContent = `Yield (${snapshot.date})`;
    const thLat = document.getElementById('th-lat');
    thLat.textContent = isLatest ? '' : `Yield (${latest.date})`;
    thLat.style.display = isLatest ? 'none' : '';

    const tbody = document.getElementById('tbody');
    tbody.innerHTML = '';

    for (const m of allMaturities) {
      const selY = yieldFor(snapshot, m);
      const latY = yieldFor(latest, m);
      if (selY === undefined && latY === undefined) continue;

      const isSig = SIG_YEARS.has(m);
      const tr = document.createElement('tr');
      if (isSig) tr.classList.add('sig');

      const badge = isSig ? `<span class="yr-badge">(${m - latestYear}yr)</span>` : '';
      tr.innerHTML = `
        <td>${m}${badge}</td>
        <td>${selY !== undefined ? selY.toFixed(3) + '%' : '—'}</td>
        <td style="display:${isLatest ? 'none' : ''}">${latY !== undefined ? latY.toFixed(3) + '%' : '—'}</td>
      `;
      tr.addEventListener('click', () => openModal(m));
      tbody.appendChild(tr);
    }
  }

  // --- Nav ---
  function update() {
    const snapshot = snapshots[selectedIdx];
    const isLatest = selectedIdx === snapshots.length - 1;

    document.getElementById('nav-date').textContent = snapshot.date;
    document.getElementById('nav-hint').textContent =
      isLatest ? '(most recent)' : `latest: ${latest.date}`;
    document.getElementById('btn-prev').disabled = selectedIdx === 0;
    document.getElementById('btn-next').disabled = isLatest;

    renderChart(snapshot);
    renderTable(snapshot);
  }

  document.getElementById('btn-prev').addEventListener('click', () => {
    if (selectedIdx > 0) { selectedIdx--; update(); }
  });
  document.getElementById('btn-next').addEventListener('click', () => {
    if (selectedIdx < snapshots.length - 1) { selectedIdx++; update(); }
  });
  document.addEventListener('keydown', e => {
    if (!document.getElementById('modal').classList.contains('hidden')) return;
    if (e.key === 'ArrowLeft' && selectedIdx > 0) { selectedIdx--; update(); }
    if (e.key === 'ArrowRight' && selectedIdx < snapshots.length - 1) { selectedIdx++; update(); }
  });

  // --- Modal ---
  function openModal(maturityYear) {
    if (modalChart) { modalChart.destroy(); modalChart = null; }

    const points = snapshots
      .map(s => ({ x: s.date, y: yieldFor(s, maturityYear) }))
      .filter(p => p.y !== undefined);

    const label = SIG_YEARS.has(maturityYear)
      ? `Maturity ${maturityYear} · ${maturityYear - latestYear}-year`
      : `Maturity ${maturityYear}`;
    document.getElementById('modal-heading').textContent = label;
    document.getElementById('modal').classList.remove('hidden');

    const ctx = document.getElementById('modal-canvas').getContext('2d');
    modalChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: points.map(p => p.x),
        datasets: [{
          data: points.map(p => p.y),
          borderColor: BLUE,
          backgroundColor: 'rgba(37,99,235,0.06)',
          fill: true,
          tension: 0.3,
          pointRadius: 4,
          pointHoverRadius: 6,
          borderWidth: 2,
          pointBackgroundColor: BLUE,
        }],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: { label: item => item.parsed.y.toFixed(3) + '%' } },
        },
        scales: {
          x: { grid: { color: '#f1f5f9' }, ticks: { color: '#64748b', font: { size: 11 } } },
          y: {
            title: { display: true, text: 'Avg Yield (%)', color: '#64748b', font: { size: 11 } },
            grid: { color: '#f1f5f9' },
            ticks: { color: '#64748b', callback: v => v.toFixed(2) + '%' },
          },
        },
      },
    });
  }

  function closeModal() {
    document.getElementById('modal').classList.add('hidden');
    if (modalChart) { modalChart.destroy(); modalChart = null; }
  }

  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('modal').addEventListener('click', e => {
    if (e.target === document.getElementById('modal')) closeModal();
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  update();
})();
</script>
</body>
</html>
